LABEL arch
TEXT HELP
Install Arch Linux / CachyOS to the first disk (unattended, 30 s countdown).
sshd is up before the countdown; any key on the console aborts.
ENDTEXT
MENU LABEL archcloud: install to disk (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-server
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-server.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

LABEL rescue
TEXT HELP
Boot to a root shell with sshd; nothing is written to disk.
Run archcloud-install by hand when ready.
ENDTEXT
MENU LABEL archcloud: ^rescue shell, no install (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-cachyos-server
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-cachyos-server.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archcloud.autoinstall=no %KERNEL_PARAMS%
