# Installed by archcloud. The initramfs is built inside the installer's chroot,
# where mkinitcpio's autodetect only sees the hypervisor the ISO booted on.
# Pull in every common virtual storage/network driver so the disk image also
# boots after a migration or restore onto another hypervisor.
MODULES+=(virtio_blk virtio_scsi virtio_pci virtio_net
          vmw_pvscsi vmxnet3
          hv_vmbus hv_storvsc hv_netvsc
          nvme sd_mod ahci)
