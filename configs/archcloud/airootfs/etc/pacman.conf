#
# /etc/pacman.conf for the archcloud LIVE environment.
# Generic [cachyos] only: the installer renders the target's pacman.conf with
# the repo level matching the probed CPU (see /usr/local/bin/archcloud-install).
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
