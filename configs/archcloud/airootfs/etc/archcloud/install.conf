# /etc/archcloud/install.conf — baked defaults for archcloud-install.
#
# Precedence (highest first):
#   1. seed volume (label ARCHCLOUD or CIDATA) file install.conf
#   2. kernel command line:  archcloud.<key>=<value>
#   3. this file
# Values are shell assignments; keep them quoted. Keys are case-insensitive on
# the kernel command line (archcloud.hostname=web1).

# Hostname. Empty = "arch-" + 4 hex chars derived from /etc/machine-id.
HOSTNAME=""

# Target disk. "auto" = the single largest non-removable disk that is not the
# install medium; the installer refuses to guess between several candidates.
DISK="auto"

# Primary user (UID 1000, wheel, passwordless sudo, zsh) and its SSH key.
USER="darkspadez"
SSH_PUBKEY="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILMIEKei+ED9h1Azg/bwND6Y2Ah3qVxtX31uG+XH6xow darkspadez@tardis.local"

# crypt(3) hash for the user's password (mkpasswd -m sha-512 / openssl passwd -6).
# Empty = account password locked; SSH key + sudo still work. Root is always locked.
PASSWORD_HASH=""

TIMEZONE="America/New_York"
LOCALE="en_US.UTF-8"
KEYMAP="us"

# CachyOS repo level for the installed system: auto | generic | v3 | v4 | znver4
CACHYOS_LEVEL="auto"

# Keep the stock Arch kernel as a Limine fallback entry next to linux-cachyos-server.
KEEP_STOCK_KERNEL="true"

# LazyVim starter for root and the user (plugins sync on first boot).
INSTALL_LAZYVIM="true"

# Countdown before the disk is touched (seconds). 0 = no countdown.
COUNTDOWN="30"

# Reboot when the installation finished ("yes"/"no").
REBOOT="yes"

# Refuse to run automatically; only archcloud-install run by hand installs.
AUTOINSTALL="yes"
