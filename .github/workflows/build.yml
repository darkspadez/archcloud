name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 6 * * *'   # nightly: fresh package snapshot + CachyOS kernel
  workflow_dispatch:
    inputs:
      levels:
        description: 'JSON list of variants to build'
        default: '["generic","v3","v4"]'
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck zsh
      - run: tools/lint.sh

  build:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        level: ${{ fromJSON(github.event_name == 'pull_request' && '["generic"]' || (github.event.inputs.levels || '["generic","v3","v4"]')) }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the runner CPU can execute ${{ matrix.level }} binaries
        id: cpu
        run: |
          need=""; case "${{ matrix.level }}" in v3) need=avx2;; v4) need=avx512f;; esac
          grep -m1 'model name' /proc/cpuinfo
          if [ -n "$need" ] && ! grep -m1 '^flags' /proc/cpuinfo | grep -qw "$need"; then
            echo "::warning title=${{ matrix.level }} skipped::this runner's CPU lacks $need; pacstrap hooks would SIGILL. Re-run the job to land on another runner (gh run rerun --job)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Free disk space
        if: steps.cpu.outputs.skip != 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true
      - name: Build archcloud-${{ matrix.level }} (privileged archlinux container)
        if: steps.cpu.outputs.skip != 'true'
        run: |
          df -h /
          ./build.sh --level "${{ matrix.level }}"
          df -h /
      - name: Rename checksum file per variant
        if: steps.cpu.outputs.skip != 'true'
        run: |
          sudo chown -R "$(id -u):$(id -g)" out     # written by root inside the build container
          cd out
          mv sha256sums "sha256sums-${{ matrix.level }}.txt"
          cat "sha256sums-${{ matrix.level }}.txt" metrics.txt
      - uses: actions/upload-artifact@v4
        if: steps.cpu.outputs.skip != 'true'
        with:
          name: archcloud-${{ matrix.level }}
          path: |
            out/*.iso
            out/sha256sums-*.txt
          retention-days: 7
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        level: ${{ fromJSON(github.event_name == 'pull_request' && '["generic"]' || (github.event.inputs.levels || '["generic","v3","v4"]')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: dl
        continue-on-error: true   # the variant may have been skipped on an unsuitable build runner
        with:
          name: archcloud-${{ matrix.level }}
          path: out
      - name: No artifact for this variant
        if: steps.dl.outcome != 'success'
        run: echo "::warning title=${{ matrix.level }} smoke skipped::no archcloud-${{ matrix.level }} artifact (build skipped on an unsuitable runner)"
      - name: Install QEMU + OVMF
        if: steps.dl.outcome == 'success'
        run: |
          # Some runners boot with an unattended-upgrades run in progress that holds
          # the dpkg lock for 20+ minutes; `systemctl stop` would wait for it. Kill it.
          sudo systemctl disable --now apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl kill --signal=KILL unattended-upgrades.service apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo pkill -9 -f 'unattended-upgrade|apt-get|apt\.systemd\.daily' 2>/dev/null || true
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a >/dev/null 2>&1 || true
          sudo apt-get -o DPkg::Lock::Timeout=300 update -qq
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf xorriso
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; echo "kvm: yes"; else echo "kvm: no (TCG)"; fi
          grep -m1 'model name' /proc/cpuinfo; grep -o -w 'avx2\|avx512f' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
      - name: Smoke boot (UEFI)
        if: steps.dl.outcome == 'success'
        run: tools/boot-test.sh -u -i out/archcloud-${{ matrix.level }}-*.iso --timeout 900
      - name: Smoke boot (BIOS)
        if: steps.dl.outcome == 'success'
        run: tools/boot-test.sh -b -i out/archcloud-${{ matrix.level }}-*.iso --timeout 900

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: archcloud-generic
          path: out
      - name: Install QEMU + OVMF
        run: |
          sudo systemctl disable --now apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo systemctl kill --signal=KILL unattended-upgrades.service apt-daily.service apt-daily-upgrade.service 2>/dev/null || true
          sudo pkill -9 -f 'unattended-upgrade|apt-get|apt\.systemd\.daily' 2>/dev/null || true
          sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock /var/cache/apt/archives/lock
          sudo dpkg --configure -a >/dev/null 2>&1 || true
          sudo apt-get -o DPkg::Lock::Timeout=300 update -qq
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf xorriso
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; echo "kvm: yes"; else echo "kvm: no (TCG)"; fi
      - name: Unattended install + boot the result (UEFI and BIOS) + reinstall guard
        run: tools/install-test.sh -i out/archcloud-generic-*.iso --keep
      - name: Collect serial logs on failure
        if: failure()
        run: |
          mkdir -p logs
          find /tmp -maxdepth 2 -name 'serial-*.log' -exec cp {} logs/ \; 2>/dev/null || true
          ls -la logs || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-serial-logs
          path: logs
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archcloud-*
          path: dist
          merge-multiple: true
      - name: Combine checksums + release notes
        run: |
          cd dist
          cat sha256sums-*.txt > sha256sums
          rm -f sha256sums-*.txt
          ls -la
          {
            echo "## Variants in this release"
            for iso in *.iso; do echo "- \`$iso\`"; done
            for l in generic v3 v4; do
              ls archcloud-"$l"-*.iso >/dev/null 2>&1 || echo "- **$l: not built** (the CI runner's CPU could not execute $l package hooks; re-run the build job on another runner and re-tag, or build locally on a capable host)"
            done
            echo; echo "Verify with \`sha256sum -c sha256sums\`. Boot: default entry installs after a 30 s countdown; \`rescue shell\` never touches the disk."
          } > ../notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.iso dist/sha256sums \
            --repo "${GITHUB_REPOSITORY}" --title "archcloud ${GITHUB_REF_NAME}" --notes-file notes.md
